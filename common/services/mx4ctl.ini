; mx4ctl configuration managed by Home Manager.

[haptics]
level = 60

[button]
; Open the actions ring with the haptic thumb-panel button.
press = menu
press_waveform = sharp_state_change
long_press = command
long_press_command = xdotool key XF86AudioPlay
long_press_waveform = knock
long_press_ms = 450
menu_select_waveform = damp_state_change
menu_scale = 1.0
force_threshold =

[menu]
Screenshot = @screenshot
Terminal = alacritty
Mute microphone = @mic-mute
Brightness = @brightness
Volume = @volume
Play / Pause = @play-pause
Lock screen = loginctl lock-session

[gestures]
enabled = true
threshold = 100
waveform = damp_state_change
left = @workspace-left
right = @workspace-right
up = @applications
down = @show-desktop
tap =

[workspace]
enabled = true
waveform = whisper_collision

[notifications]
enabled = true
respect_dnd = true
default = subtle_collision
slack = knock
teams = knock
thunderbird = jingle
signal = knock

[battery]
low_percent = 10
waveform = mad
